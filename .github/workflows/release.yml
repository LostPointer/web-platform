name: Release packages

on:
  push:
    branches: [main, next]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Personal access token with read access to the private task_tracker
      # repository. Without it that consumer check is skipped instead of
      # failing the release after a successful publish.
      CONSUMER_REPO_TOKEN: ${{ secrets.CONSUMER_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify npm publisher identity
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - id: changesets
        uses: changesets/action@v1
        with:
          version: node scripts/version.mjs
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-node points NPM_CONFIG_USERCONFIG at a temporary .npmrc that
          # resolves the auth token from NODE_AUTH_TOKEN, so the ~/.npmrc that
          # changesets/action writes from NPM_TOKEN is never read.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Ensure packages are public in npm
        run: |
          npm access public @lostpointer/web-tokens
          npm access public @lostpointer/web-styles
          npm access public @lostpointer/web-mui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/checkout@v4
        if: steps.changesets.outputs.published == 'true' && env.CONSUMER_REPO_TOKEN != ''
        with:
          repository: LostPointer/task_tracker
          path: consumers/task_tracker
          token: ${{ secrets.CONSUMER_REPO_TOKEN }}
      - uses: actions/checkout@v4
        if: steps.changesets.outputs.published == 'true'
        with:
          repository: DafeCpp/product_dev_course
          path: consumers/product_dev_course
      - name: Verify task_tracker installs released packages
        if: steps.changesets.outputs.published == 'true' && env.CONSUMER_REPO_TOKEN != ''
        working-directory: consumers/task_tracker
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @task-tracker/web build
      - name: Verify product_dev_course installs released packages
        if: steps.changesets.outputs.published == 'true'
        # experiment-tracking-frontend is a standalone package with its own
        # lockfile, not an npm workspace of the repository root.
        working-directory: consumers/product_dev_course/projects/frontend/apps/experiment-portal
        run: |
          npm ci
          npm run build
